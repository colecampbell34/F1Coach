[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1coach"
version = "0.1.0"
description = "Live F1 UDP telemetry listener and lap coach."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cole Campbell" }
]
dependencies = []

[project.optional-dependencies]
track-metadata = ["fastf1>=3.8,<4"]

[project.scripts]
f1coach = "f1coach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["f1coach*"]
